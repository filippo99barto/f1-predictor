[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "f1-ml"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "f1-data",
    "boto3",
    "mlflow",
    "numpy",
    "pandas",
    "scikit-learn",
    "xgboost",
    "sagemaker-mlflow"
]

[tool.uv.sources]
f1-data = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["f1_ml"]
