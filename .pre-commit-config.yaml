repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-cov
        name: pytest
        entry: pytest -q --cov=src --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
