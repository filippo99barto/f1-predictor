repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-cov
        name: pytest
        entry: uv run pytest -q --cov=f1_data --cov=f1_ml --cov=f1_agent --cov-report=term-missing
        language: system
        pass_filenames: false
        always_run: true
