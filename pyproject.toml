[project]
name = "f1-predictor"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/f1_data", "packages/f1_ml", "packages/f1_agent"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.16.2",
    "pre-commit",
    "jupyter",
    "ipykernel",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "mlruns",
    "datasets",
    "data",
    "notebooks",
    ".venv",
    "packages/f1_agent/ui",
    ".langgraph_api",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter; keep as warning via line-length above
]

[tool.ruff.lint.isort]
known-first-party = ["f1_data", "f1_ml", "f1_agent"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["f1_data", "f1_ml", "f1_agent"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
